spring:
  application:
    name: opspilot-backend
  servlet:
    multipart:
      # 单个上传文件最大为 10 MB
      max-file-size: 10MB
      # 整个 multipart 请求还包含文件名、请求头和分隔符，因此略大于文件限制
      max-request-size: 11MB
  datasource:
    url: jdbc:postgresql://localhost:5432/opspilot_ai
    username: postgres
    # 数据库密码从环境变量读取，不能提交到 Git。
    password: ${OPSPILOT_DB_PASSWORD}

  ai:
    model:
      # ChatModel 继续选择智谱使用的 OpenAI 兼容实现。
      chat: openai

      # EmbeddingModel 改为本地 Ollama 实现。
      embedding: ollama
    openai:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${ZHIPU_API_KEY}
      chat:
        completions-path: /chat/completions
        options:
          model: glm-4.7
    ollama:
      # Ollama 默认监听本机 11434 端口。
      base-url: http://localhost:11434

      embedding:
        # 使用已经下载到 D 盘的本地向量模型。
        model: nomic-embed-text

      init:
        # 模型已提前下载，应用启动时不再自动拉取。
        pull-model-strategy: never
    vectorstore:
      pgvector:
        # 首次启动时创建 vector_store 表及向量索引。
        initialize-schema: true

        # nomic-embed-text 返回的向量维度是 768。
        dimensions: 768

        # 使用余弦距离比较文本语义的相似程度。
        distance-type: COSINE_DISTANCE

        # HNSW 查询性能较好，并且不需要先训练索引。
        index-type: HNSW
        table-name: vector_store
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s

  flyway:
    # public schema 已存在 vector_store，让 Flyway 接管现有非空数据库。
    baseline-on-migrate: true

    # 从 0 号基线开始，保证接下来创建的 V1 脚本仍会执行。
    baseline-version: 0

opspilot:
  forecast:
    gold:
      # 保存实际调用的模型名称，用于预测版本审计和幂等判断。
      model-name: glm-4.7
      settlement-schedule:
        # 默认关闭，防止本地开发启动时意外请求外部行情接口。
        enabled: ${GOLD_SETTLEMENT_SCHEDULE_ENABLED:false}
        # 北京时间工作日上午 8:30，同步上一交易日已经发布的行情。
        cron: "${GOLD_SETTLEMENT_SCHEDULE_CRON:0 30 8 * * MON-FRI}"
        zone: "${GOLD_SETTLEMENT_SCHEDULE_ZONE:Asia/Shanghai}"
  research:
    gold:
      daily-report-schedule:
        # 默认关闭，防止本地启动时意外调用真实数据源和大模型。
        enabled: ${GOLD_DAILY_REPORT_SCHEDULE_ENABLED:false}
        # 北京时间周二到周六上午 9 点，处理上一美国交易日数据。
        cron: "${GOLD_DAILY_REPORT_SCHEDULE_CRON:0 0 9 * * TUE-SAT}"
        zone: "${GOLD_DAILY_REPORT_SCHEDULE_ZONE:Asia/Shanghai}"
    narrative:
      # 正式解读记录会保存模型名称，用于审计和幂等判断。
      model-name: glm-4.7

  market-data:
    alpha-vantage:
      base-url: https://www.alphavantage.co
      # 黄金行情 Key 只从环境变量读取，禁止写入配置文件和 Git。
      api-key: ${ALPHA_VANTAGE_API_KEY:}
      connect-timeout: 5s
      read-timeout: 20s

  macro-data:
    fred:
      base-url: https://api.stlouisfed.org
      # FRED Key 只从环境变量读取，禁止写进配置文件和 Git。
      api-key: ${FRED_API_KEY:}
      series-id: DFII10
      dollar-index-series-id: DTWEXBGS
      connect-timeout: 5s
      read-timeout: 20s
