spring:
  application:
    name: opspilot-backend
  servlet:
    multipart:
      # 单个上传文件最大为 10 MB
      max-file-size: 10MB
      # 整个 multipart 请求还包含文件名、请求头和分隔符，因此略大于文件限制
      max-request-size: 11MB


  ai:
    openai:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${ZHIPU_API_KEY}
      chat:
        completions-path: /chat/completions
        options:
          model: glm-4.7
      embedding:
        #指定智谱向量模型，避免使用Spring AI 默认的OpenAI模型
        options:
          model: embedding-3
        embeddings-path: /embeddings

    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
