spring:
  application:
    name: opspilot-backend
  servlet:
    multipart:
      # 单个上传文件最大为 10 MB
      max-file-size: 10MB
      # 整个 multipart 请求还包含文件名、请求头和分隔符，因此略大于文件限制
      max-request-size: 11MB


  ai:
    model:
      # ChatModel 继续选择智谱使用的 OpenAI 兼容实现。
      chat: openai

      # EmbeddingModel 改为本地 Ollama 实现。
      embedding: ollama
    openai:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${ZHIPU_API_KEY}
      chat:
        completions-path: /chat/completions
        options:
          model: glm-4.7
    ollama:
      # Ollama 默认监听本机 11434 端口。
      base-url: http://localhost:11434

      embedding:
        # 使用已经下载到 D 盘的本地向量模型。
        model: nomic-embed-text

      init:
        # 模型已提前下载，应用启动时不再自动拉取。
        pull-model-strategy: never



    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
